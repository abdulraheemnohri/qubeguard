name: Publish QubeGuard Transformer Model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "optimum-onnx[onnxruntime]" transformers huggingface_hub

      - name: Export and quantize Transformer
        run: python scripts/export_transformer_to_onnx.py

      - name: Publish mobile runtime repository
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_HUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "abdulraheemnohri/qubeguard-transformer-model"
          api.create_repo(repo_id=repo_id, repo_type="model", private=False, exist_ok=True)
          api.upload_folder(
              repo_id=repo_id,
              repo_type="model",
              folder_path="dist/qubeguard-transformer",
              path_in_repo=".",
              commit_message="Publish QubeGuard mobile Transformer runtime",
          )
          PY
